<script>
const N=a=>a.map(t=>({t}));
const ML=[['Dear students,'],['We are now ready to send you information about our school trip to the Moon next month.'],['Sunday May 4th: We’re going to arrive at the launch pad at 4 a.m. We’re going to travel by express rocket to the Moon. We take off at 6 a.m. Bring a small suitcase because the rocket isn’t very big!'],['Monday May 5th: The rocket lands at 6 p.m. We’re going to travel by Moon bus to the hotel. We’re going to stay in the wonderful Space Hotel. It isn’t very big, but it’s quite comfortable. We’re going to eat special space food for dinner. It looks funny, but it’s delicious!'],['Tuesday–Thursday 6th–8th May: We’re going to explore the Moon! Everyone needs to wear spacesuits with big helmets and heavy boots. We’re going to walk on the Moon and travel in special space cars. Bring some very warm clothes to wear under your spacesuit.'],['Friday 9th May: The rocket to Earth takes off at 10 a.m. Enjoy the journey! If you look through the windows, you’ll see amazing views of Earth!'],['If you have any questions, you can email me at any time. We look forward to seeing you soon. Yours, Mrs Muna, head teacher']];
const F2=N(['Formal','Informal']);
const A=[
{n:'1 · Words in context',min:3,type:'mc',q:[
{pr:'The ___ rocket makes no stops on the way to the Moon.',o:N(['express','lucky','busy']),a:0},
{pr:'The roads to the launch pad are very ___ in the morning.',o:N(['lovely','busy','brand-new']),a:1},
{pr:'We are ___ because the Space Hotel has a swimming pool.',o:N(['lucky','express','busy']),a:0},
{pr:'The view of Earth from the Moon is ___.',o:N(['busy','express','wonderful']),a:2},
{pr:'My ___ spacesuit is not old. I got it yesterday.',o:N(['brand-new','lovely','busy']),a:0},
{pr:'What a ___ photo of the Moon!',o:N(['busy','lovely','express']),a:1}]},
{n:'2 · Read and complete',min:5,type:'mc',lines:ML,q:[
{pr:'We’re going to travel by ___ rocket to the Moon.',o:N(['express','heavy','delicious']),a:0},
{pr:'Bring a ___ suitcase because the rocket isn’t very big!',o:N(['amazing','heavy','small']),a:2},
{pr:'The hotel isn’t very ___, but it’s quite comfortable.',o:N(['delicious','big','express']),a:1},
{pr:'The space food looks funny, but it’s ___!',o:N(['delicious','heavy','small']),a:0},
{pr:'Everyone needs to wear spacesuits with big helmets and ___ boots.',o:N(['amazing','delicious','heavy']),a:2},
{pr:'If you look through the windows, you’ll see ___ views of Earth!',o:N(['amazing','small','express']),a:0}]},
{n:'3 · The Moon trip',min:3,type:'mc',q:[
{pr:'What time do they arrive at the launch pad?',o:N(['4 a.m.','6 a.m.','6 p.m.']),a:0},
{pr:'When does the rocket take off on Sunday?',o:N(['6 p.m.','10 a.m.','6 a.m.']),a:2},
{pr:'Where are they going to stay?',o:N(['In a tent','In the Space Hotel','In a rocket']),a:1},
{pr:'What does everyone need to wear to explore the Moon?',o:N(['Spacesuits with big helmets and heavy boots','Swimsuits and flip-flops','Raincoats and sunhats']),a:0},
{pr:'How do they travel on the Moon?',o:N(['By bus','By special space cars','By train']),a:1},
{pr:'When does the rocket to Earth take off?',o:N(['Friday 9th May at 10 a.m.','Sunday 4th May at 6 a.m.','Monday 5th May at 6 p.m.']),a:0}]},
{n:'4 · How to write an email',min:4,type:'mc',q:[
{pr:'What information can you find at the top of an email?',o:N(['The subject and who the email is to','A picture','The weather']),a:0},
{pr:'How do the emails start?',o:N(['With Dear (name)','With Bye','With Yours']),a:0},
{pr:'How do they end?',o:N(['With Dear (name)','With Yours, (name)','With Hi']),a:1},
{pr:'Are the emails about the school trips formal or informal?',o:F2,a:0},
{pr:'“Dear students”',o:F2,a:0},
{pr:'“Hi …”',o:F2,a:1},
{pr:'“We look forward to seeing you soon”',o:F2,a:0},
{pr:'“See you soon …”',o:F2,a:1}]},
{n:'5 · Build your email',min:6,type:'build'},
{n:'6 · Final task',min:4,type:'cloze'}];
const CL=5;
const BS=[['To:',['my best friend','Grade 7 students','everyone'],1],['Subject:',['Hey! Moon trip!!!','Trip','School trip to the Moon'],2],['Start the email:',['Dear students,','Hi guys,','Hello!'],0],['Why are you writing?',['Here’s some info about the trip.','We are now ready to send you information about our school trip.','Guess what, a trip!'],1],['Describe what the students are going to do:',['Sunday: rocket, lol. Bring stuff.','On Sunday, we are going to travel by express rocket to the Moon. Bring a small suitcase.','We go on a rocket.'],1],['End the email correctly:',['Bye!','See you soon… From Muna','We look forward to seeing you soon, Yours, Mrs Muna'],2]];
const CK=['Have I put who the email is to and included a subject?','Have I started with Dear ... and said why I am writing?','Have I divided the email into paragraphs?','Have I ended the email correctly, with Yours, (name)?'];
const C={t:'An email starts with {0} (1) and the name. It ends with {1} (2) and the name. A formal email is {2} (3) and professional. In the first paragraph, we say why we are {3} (4). We divide the email into {4} (5).',o:[['Dear','Hi','Hey'],['Bye','Yours,','See you'],['casual','polite','funny'],['packing','sleeping','writing'],['paragraphs','pictures','numbers']],a:[0,1,1,2,0]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,sh:false,b:{},bad:null,msg:''});
let S={step:0,st:A.map(nst)};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function playT(L){try{speechSynthesis.cancel();L.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)})}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function play(){playT(ML.map(x=>x[0]))}
function scr(){S.st[S.step].sh=!S.st[S.step].sh;render()}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]=nst();tone([440,523],.1);render()}
function bd(sec,i){const s=S.st[4];if(s.b[sec]!==undefined)return;if(i===BS[sec][2]){s.b[sec]=i;s.bad=null;s.msg='Formal! Well done.';GOOD();s.sc=Object.keys(s.b).length===6?1:0}else{s.bad=[sec,i];s.msg='That’s too informal. Try the formal one!';BAD()}render()}
function btext(){const s=S.st[4],g=k=>BS[k][1][s.b[k]];return 'To: '+g(0)+'\nSubject: '+g(1)+'\n\n'+g(2)+'\n'+g(3)+'\n\n'+g(4)+'\n\n'+g(5)}
function bhear(){say(btext().replace(/\n+/g,'. '))}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="justify-content:center">'+(s.sc===n?'Perfect mission! Amazing work!':s.sc>=n-1?'Well done, astronaut!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next planet →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 const au=a.lines?'<div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="play()">▶ Listen to the email</button><button class="go" style="padding:8px 24px;font-size:18px" onclick="scr()">'+(s.sh?'Hide':'Show')+' the email</button></div>'+(s.sh?'<div class="mail"><b>To:</b> Grade 7 students · <b>Subject:</b> School trip to the Moon<br>'+a.lines.map(l=>l[0]).join('<br>')+'</div>':''):'';
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div>'+au+'<div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')"><span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?'<span class="seal'+(ok?'':' no')+'">'+(ok?'LIFT<br>OFF!':'TRY<br>AGAIN')+'</span><span>The answer is: '+q.o[q.a].t+'.</span>':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='build'){const all=Object.keys(s.b).length===6;return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Stars: '+s.sc+'</span></div><div class="learn"><b>Writing tip:</b> A formal email is polite and professional. Build a formal email from the head teacher about a school trip: choose the formal sentence for each part.</div>'+BS.map((b,k)=>'<div><div class="q2">'+(k+1)+') '+b[0]+'</div><div class="grid" style="margin-top:6px">'+b[1].map((x,i)=>'<button class="o'+(s.b[k]===i?' ok':(s.bad&&s.bad[0]===k&&s.bad[1]===i)?' bad':'')+'" '+(s.b[k]!==undefined?'disabled':'')+' onclick="bd('+k+','+i+')"><span>'+x+'</span></button>').join('')+'</div></div>').join('')+'<div class="fb">'+s.msg+'</div>'+(all?'<div class="mail" style="max-height:none"><b>My email</b><br>'+btext().replace(/\n/g,'<br>')+'</div><div class="chk">'+CK.map(c=>'<div class="on"><i>✓</i>'+c+'</div>').join('')+'</div><div class="row"><button class="go alt" onclick="bhear()">▶ Hear my email</button></div>':'')+'</div>'}
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · Writing an email</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+(s.chk?'<div class="big-stamp">'+n+' / 5</div>':'')+'<div class="row"><span style="margin-right:auto;font-size:20px;font-weight:700">'+(s.chk?(n===5?'Perfect landing! Amazing!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit" style="color:var(--ink)">Created by T.Badria Alfalahi</div></div>'}
function render(){
 const L=A.length-1;
 document.getElementById('nav').innerHTML='<span>Choose your planet:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');
 document.getElementById('stars').textContent=stars();
 document.getElementById('pl').style.left='calc('+(S.step/L*100)+'% - '+(S.step/L*60)+'px)';
 document.getElementById('stations').innerHTML=A.map((a,k)=>'<span class="st'+(k<=S.step?' on':'')+'" style="left:'+(k/L*100)+'%"></span>').join('');
 document.getElementById('main').innerHTML=view()}
render();
</script></body></html>
